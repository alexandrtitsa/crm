<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Можливості</title>
</head>
<body>
<section>
    <h1>Список можливостей</h1>
    <a th:href="@{/opportunities/add}" class="btn btn-primary mb-3">Додати можливість</a>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Назва</th>
            <th>Ймовірність</th>
            <th>Очікувана вартість</th>
            <th>Стадія</th>
            <th>Лід</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="op : ${opportunities}">
            <td th:text="${op.id}">1</td>
            <td th:text="${op.name}">Negotiation</td>
            <td th:text="${op.probability} + '%'">80%</td>
            <td th:text="${op.expectedValue}">10000</td>
            <td th:text="${op.stage}">Proposal</td>
            <td th:text="${op.leadId}">12</td>
            <td>
                <a th:href="@{/opportunities/{id}/edit(id=${op.id})}" class="btn btn-sm btn-secondary">Редагувати</a>
                <form th:action="@{/opportunities/{id}/delete(id=${op.id})}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-sm btn-danger">Видалити</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>

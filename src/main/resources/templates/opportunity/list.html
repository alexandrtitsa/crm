<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Можливості</title>
</head>
<body>
<section class="activities-section">
    <h1>Можливості</h1>
    <a class="btn btn-primary mb-3" th:href="@{/opportunities/add}">Додати</a>
    <table class="table table-striped table-bordered align-middle">
        <thead>
        <tr>
            <th>Назва</th>
            <th>Ймовірність (%)</th>
            <th>Очікувана вартість</th>
            <th>Стадія</th>
            <th>Лід</th>
            <th>Дії</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="op : ${opportunities}">
            <td th:text="${op.name}"></td>
            <td th:text="${op.probability}"></td>
            <td th:text="${op.expectedValue}"></td>
            <td th:text="${op.stage}"></td>
            <td th:text="${op.leadId}"></td>
            <td>
                <a th:href="@{'/opportunities/' + ${op.id} + '/edit'}" class="btn btn-sm btn-warning">Редагувати</a>
                <form th:action="@{'/opportunities/' + ${op.id} + '/delete'}" method="post" style="display:inline;">
                    <button class="btn btn-sm btn-danger">Видалити</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>

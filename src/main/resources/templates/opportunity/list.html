<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk"
      th:replace="layout :: layout (~{::title}, ~{::body})">
<head>
    <title>Угоди</title>
</head>
<body>
<div th:fragment="content">
    <h2 class="mb-3">Список угод</h2>

    <div class="mb-3 text-end">
        <a class="btn btn-success" th:href="@{/opportunities/new}">+ Нова угода</a>
    </div>

    <table class="table table-bordered table-hover">
        <thead>
        <tr>
            <th>Назва</th>
            <th>Ймовірність</th>
            <th>Сума</th>
            <th>Стадія</th>
            <th>Лід</th>
            <th>Дії</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="opp : ${opportunities}">
            <td th:text="${opp.name}">Угода</td>
            <td th:text="${opp.probability + '%'}">80%</td>
            <td th:text="${opp.expectedValue}">10000</td>
            <td th:text="${opp.stage}">Proposal</td>
            <td th:text="${opp.leadSummary}">Контакт/Компанія</td>
            <td class="d-flex gap-2">
                <a th:href="@{'/opportunities/' + ${opp.id} + '/edit'}" class="btn btn-sm btn-outline-primary">Редагувати</a>
                <form th:action="@{'/opportunities/' + ${opp.id} + '/delete'}" method="post"
                      onsubmit="return confirm('Видалити угоду?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Видалити</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

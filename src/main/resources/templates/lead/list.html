<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Ліди</title>
</head>
<body>
<section class="activities-section">
    <h1>Ліди</h1>
    <a class="btn btn-primary mb-3" th:href="@{/leads/add}">Додати</a>
    <table class="table table-striped table-bordered align-middle">
        <thead>
        <tr>
            <th>Джерело</th>
            <th>Статус</th>
            <th>Контакт</th>
            <th>Компанія</th>
            <th>Дії</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="lead : ${leads}">
            <td th:text="${lead.source}"></td>
            <td th:text="${lead.status}"></td>
            <td th:text="${lead.contactId}"></td>
            <td th:text="${lead.companyId}"></td>
            <td>
                <a th:href="@{'/leads/' + ${lead.id} + '/edit'}" class="btn btn-sm btn-warning">Редагувати</a>
                <form th:action="@{'/leads/' + ${lead.id} + '/delete'}" method="post" style="display:inline;">
                    <button class="btn btn-sm btn-danger">Видалити</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>

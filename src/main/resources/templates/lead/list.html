<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk"
      th:replace="layout :: layout (~{::title}, ~{::body})">
<head>
    <title>Ліди</title>
</head>
<body>
<div th:fragment="content">
    <h2 class="mb-3">Список лідів</h2>

    <div class="mb-3 text-end">
        <a class="btn btn-success" th:href="@{/leads/new}">+ Новий лід</a>
    </div>

    <table class="table table-bordered table-hover">
        <thead>
        <tr>
            <th>Джерело</th>
            <th>Статус</th>
            <th>Контакт</th>
            <th>Компанія</th>
            <th>Дії</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="lead : ${leads}">
            <td th:text="${lead.source}">Email</td>
            <td th:text="${lead.status}">New</td>
            <td th:text="${lead.contactName}">Іван Іванов</td>
            <td th:text="${lead.companyName}">Acme</td>
            <td class="d-flex gap-2">
                <a th:href="@{'/leads/' + ${lead.id} + '/edit'}" class="btn btn-sm btn-outline-primary">Редагувати</a>
                <form th:action="@{'/leads/' + ${lead.id} + '/delete'}" method="post"
                      onsubmit="return confirm('Видалити цього ліда?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Видалити</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

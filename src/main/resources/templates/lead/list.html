<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(~{::title}, ~{::section})">
<head>
    <meta charset="UTF-8">
    <title>Ліди</title>
</head>
<body>
<section>
    <div class="container mt-4">
        <h2>Ліди</h2>
        <a class="btn btn-primary mb-3" th:href="@{/leads/add}">Додати лід</a>
        <table class="table table-bordered">
            <thead>
            <tr>
                <th>ID</th>
                <th>Джерело</th>
                <th>Статус</th>
                <th>Контакт</th>
                <th>Компанія</th>
                <th>Дії</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="lead : ${leads}">
                <td th:text="${lead.id}">1</td>
                <td th:text="${lead.source}">Email</td>
                <td th:text="${lead.status}">New</td>
                <td th:text="${lead.contactName}">Ім’я Контакту</td>
                <td th:text="${lead.companyName}">Назва Компанії</td>
                <td>
                    <a class="btn btn-sm btn-warning" th:href="@{'/leads/' + ${lead.id} + '/edit'}">Редагувати</a>
                    <form th:action="@{'/leads/' + ${lead.id} + '/delete'}" method="post" style="display:inline;">
                        <button class="btn btn-sm btn-danger" type="submit">Видалити</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>

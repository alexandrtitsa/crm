<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk"
      th:replace="layout :: layout (~{::title}, ~{::body})">
<head>
    <title>Лід</title>
</head>
<body>
<div th:fragment="content">
    <h2 th:text="${editId != null} ? 'Редагувати ліда' : 'Новий лід'" class="mb-3"></h2>

    <form th:action="@{/leads}" method="post" th:object="${leadForm}">
        <input type="hidden" name="editId" th:value="${editId}"/>

        <div class="mb-3">
            <label class="form-label">Джерело</label>
            <input type="text" th:field="*{source}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Статус</label>
            <input type="text" th:field="*{status}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Контакт</label>
            <select th:field="*{contactId}" class="form-select">
                <option th:value="">-- Оберіть --</option>
                <option th:each="c : ${contacts}" th:value="${c.id}"
                        th:text="${c.firstName + ' ' + c.lastName}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Компанія</label>
            <select th:field="*{companyId}" class="form-select">
                <option th:value="">-- Оберіть --</option>
                <option th:each="c : ${companies}" th:value="${c.id}" th:text="${c.name}"></option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Зберегти</button>
        <a th:href="@{/leads}" class="btn btn-secondary ms-2">Скасувати</a>
    </form>
</div>
</body>
</html>

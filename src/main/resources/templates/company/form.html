<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk"
      th:replace="layout :: layout (~{::title}, ~{::body})">
<head>
    <title>Форма компанії</title>
</head>
<body>
<div th:fragment="content">
    <h2 th:text="${editId != null} ? 'Редагувати компанію' : 'Створити компанію'" class="mb-3"></h2>

    <form th:action="@{/companies}" method="post" th:object="${companyForm}">
        <input type="hidden" name="editId" th:value="${editId}" />

        <div class="mb-3">
            <label class="form-label">Назва *</label>
            <input type="text" th:field="*{name}" class="form-control" required>
            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Галузь</label>
            <input type="text" th:field="*{industry}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Адреса</label>
            <input type="text" th:field="*{address}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Сайт</label>
            <input type="url" th:field="*{website}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Опис</label>
            <textarea th:field="*{description}" class="form-control" rows="4"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Зберегти</button>
        <a th:href="@{/companies}" class="btn btn-secondary ms-2">Скасувати</a>
    </form>
</div>
</body>
</html>

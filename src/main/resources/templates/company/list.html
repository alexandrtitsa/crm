<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список компаній</title>
</head>
<body th:replace="~{layout :: layout(~{::title}, ~{::section})}">

<section>
    <h1>Компанії</h1>

    <form method="get" class="mb-3">
        <input type="text" name="search" th:value="${request.search}" placeholder="Пошук..." />
        <button type="submit">Пошук</button>
        <a th:href="@{/companies/new}">+ Додати</a>
    </form>

    <table>
        <thead>
        <tr>
            <th><a th:href="@{/companies(sort='name', direction=${request.direction == 'ASC' ? 'DESC' : 'ASC'}, search=${request.search})}">Назва</a></th>
            <th>Індустрія</th>
            <th>Опис</th>
            <th>Дії</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="company : ${companies.content}">
            <td th:text="${company.name}">Назва</td>
            <td th:text="${company.industry}">Індустрія</td>
            <td th:text="${company.description}">Опис</td>
            <td>
                <a th:href="@{/companies/{id}/edit(id=${company.id})}">Редагувати</a>
                <form th:action="@{/companies/{id}/delete(id=${company.id})}" method="post" th:object="${company}" style="display:inline;">
                    <button type="submit">Видалити</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <div>
        <span th:text="'Сторінка ' + ${companies.number + 1} + ' з ' + ${companies.totalPages}"></span>
        <div>
            <a th:href="@{/companies(page=${companies.number - 1}, search=${request.search})}" th:if="${companies.hasPrevious()}">← Попередня</a>
            <a th:href="@{/companies(page=${companies.number + 1}, search=${request.search})}" th:if="${companies.hasNext()}">Наступна →</a>
        </div>
    </div>
</section>

</body>
</html>

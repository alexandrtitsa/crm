<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Компанії</title>
</head>
<body>
<section class="activities-section">
    <h1>Компанії</h1>
    <a class="btn btn-primary mb-3" th:href="@{/companies/new}">Додати</a>
    <table class="table table-striped table-bordered align-middle">
        <thead>
        <tr>
            <th>Назва</th>
            <th>Індустрія</th>
            <th>Адреса</th>
            <th>Сайт</th>
            <th>Опис</th>
            <th>Дії</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="company : ${companies}">
            <td th:text="${company.name}"></td>
            <td th:text="${company.industry}"></td>
            <td th:text="${company.address}"></td>
            <td th:text="${company.website}"></td>
            <td th:text="${company.description}"></td>
            <td>
                <a th:href="@{'/companies/' + ${company.id} + '/edit'}" class="btn btn-sm btn-warning">Редагувати</a>
                <form th:action="@{'/companies/' + ${company.id} + '/delete'}" method="post" style="display:inline;">
                    <button class="btn btn-sm btn-danger">Видалити</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>

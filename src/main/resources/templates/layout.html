<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, body)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">ACRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">ACRM</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
                <a class="nav-link" th:href="@{/companies}">Компанії</a>
                <a class="nav-link" th:href="@{/contacts}">Контакти</a>
                <a class="nav-link" th:href="@{/leads}">Ліди</a>
                <a class="nav-link" th:href="@{/opportunities}">Угоди</a>
                <a class="nav-link" th:href="@{/activities}">Активності</a>
                <span class="nav-link disabled">|</span>
                <a class="nav-link" th:href="@{/admin}" sec:authorize="hasRole('ADMIN')">Адмін</a>
                <a class="nav-link" th:href="@{/logout}">Вийти</a>
            </div>
        </div>
    </div>
</nav>

<main class="container" th:replace="${body}">
    Контент не задано
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Активності</title>
</head>
<body>
<section class="activities-section">
    <h1>Активності</h1>
    <a class="btn btn-primary mb-3" th:href="@{/activities/new}">Додати</a>
    <table class="table table-striped table-bordered align-middle">
        <thead>
        <tr>
            <th>Тип</th>
            <th>Час</th>
            <th>Опис</th>
            <th>Контакт</th>
            <th>Можливість</th>
            <th>Дії</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${activities}">
            <td th:text="${a.type}"></td>
            <td th:text="${a.dateTime}"></td>
            <td th:text="${a.description}"></td>
            <td th:text="${a.contactId}"></td>
            <td th:text="${a.opportunityId}"></td>
            <td>
                <a th:href="@{'/activities/' + ${a.id} + '/edit'}" class="btn btn-sm btn-warning">Редагувати</a>
                <form th:action="@{'/activities/' + ${a.id} + '/delete'}" method="post" style="display:inline;">
                    <button class="btn btn-sm btn-danger">Видалити</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>

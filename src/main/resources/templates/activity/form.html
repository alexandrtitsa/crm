<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <meta charset="UTF-8">
    <title th:text="${activity.id != null} ? 'Редагувати' : 'Додати'">Активність</title>
</head>
<body>
<section>
    <h1 th:text="${activity.id != null} ? 'Редагувати активність' : 'Нова активність'"></h1>
    <form th:action="${activity.id != null} ? @{'/activities/' + ${activity.id}} : @{/activities}" th:object="${activity}" method="post">
        <div class="form-group">
            <label for="type">Тип</label>
            <input type="text" th:field="*{type}" class="form-control"/>
        </div>
        <div class="form-group">
            <label for="dateTime">Час</label>
            <input type="datetime-local" th:field="*{dateTime}" class="form-control"/>
        </div>
        <div class="form-group">
            <label for="description">Опис</label>
            <textarea th:field="*{description}" class="form-control"></textarea>
        </div>
        <div class="form-group">
            <label for="contactId">Контакт</label>
            <select th:field="*{contactId}" class="form-control">
                <option th:each="c : ${contacts}" th:value="${c.id}" th:text="${c.id}"></option>
            </select>
        </div>
        <div class="form-group">
            <label for="opportunityId">Можливість</label>
            <select th:field="*{opportunityId}" class="form-control">
                <option th:each="o : ${opportunities}" th:value="${o.id}" th:text="${o.id}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary mt-3">Зберегти</button>
    </form>
</section>
</body>
</html>

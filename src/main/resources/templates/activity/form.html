<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk"
      th:replace="layout :: layout (~{::title}, ~{::body})">
<head>
    <title>Форма активності</title>
</head>
<body>
<div th:fragment="content">
    <h2 th:text="${editId != null} ? 'Редагувати активність' : 'Нова активність'" class="mb-3"></h2>

    <form th:action="@{/activities}" method="post" th:object="${activityForm}">
        <input type="hidden" name="editId" th:value="${editId}"/>

        <div class="mb-3">
            <label class="form-label">Тип</label>
            <input type="text" th:field="*{type}" class="form-control" placeholder="Call, Meeting, Note" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Дата та час</label>
            <input type="datetime-local" th:field="*{dateTime}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Опис</label>
            <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Контакт</label>
            <select th:field="*{contactId}" class="form-select">
                <option th:value="">-- Не обрано --</option>
                <option th:each="c : ${contacts}" th:value="${c.id}"
                        th:text="${c.firstName + ' ' + c.lastName}">Контакт</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Угода</label>
            <select th:field="*{opportunityId}" class="form-select">
                <option th:value="">-- Не обрано --</option>
                <option th:each="o : ${opportunities}" th:value="${o.id}" th:text="${o.name}">Угода</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Зберегти</button>
        <a th:href="@{/activities}" class="btn btn-secondary ms-2">Скасувати</a>
    </form>
</div>
</body>
</html>

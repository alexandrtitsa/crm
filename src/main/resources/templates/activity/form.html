<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Форма активності</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/quartz/bootstrap.min.css" rel="stylesheet">
</head>
<body th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<section>
    <div class="container mt-4">
        <h2 th:text="${activity.id != null} ? 'Редагування активності' : 'Нова активність'"></h2>
        <form th:action="${activity.id != null} ? @{'/activities/' + ${activity.id}} : @{/activities}" th:object="${activity}" method="post">
            <div class="mb-3">
                <label for="type" class="form-label">Тип</label>
                <input type="text" class="form-control" id="type" th:field="*{type}" required>
            </div>
            <div class="mb-3">
                <label for="dateTime" class="form-label">Час</label>
                <input type="datetime-local" class="form-control" id="dateTime" th:field="*{dateTime}" required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Опис</label>
                <textarea class="form-control" id="description" th:field="*{description}"></textarea>
            </div>
            <div class="mb-3">
                <label for="contactId" class="form-label">Контакт</label>
                <select class="form-select" id="contactId" th:field="*{contactId}" required>
                    <option value="" disabled>Оберіть контакт</option>
                    <option th:each="c : ${contacts}"
                            th:value="${c.id}"
                            th:text="${c.firstName + ' ' + c.lastName}"
                            th:selected="${activity.contactId} == ${c.id}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label for="opportunityId" class="form-label">Можливість</label>
                <select class="form-select" id="opportunityId" th:field="*{opportunityId}">
                    <option value="" disabled>Оберіть можливість</option>
                    <option th:each="o : ${opportunities}"
                            th:value="${o.id}"
                            th:text="${o.name}"
                            th:selected="${activity.opportunityId} == ${o.id}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Зберегти</button>
            <a th:href="@{/activities}" class="btn btn-secondary">Скасувати</a>
        </form>
    </div>
</section>
</body>
</html>

<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${editId != null} ? 'Редагувати активність' : 'Нова активність'">Форма активності</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/quartz/bootstrap.min.css" rel="stylesheet">
</head>
<body th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<section>
    <div class="container mt-4">
        <h1 th:text="${editId != null} ? 'Редагувати активність' : 'Нова активність'"></h1>
        <form th:action="${editId != null} ? @{'/activities/' + ${editId} + '/edit'} : @{/activities}"
              th:object="${activityForm}" method="post">
            <div class="mb-3">
                <label class="form-label">Тип</label>
                <input type="text" th:field="*{type}" class="form-control" required/>
            </div>
            <div class="mb-3">
                <label class="form-label">Дата та час</label>
                <input type="datetime-local" th:field="*{dateTime}" class="form-control"/>
            </div>
            <div class="mb-3">
                <label class="form-label">Опис</label>
                <textarea th:field="*{description}" class="form-control"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Контакт</label>
                <select th:field="*{contactId}" class="form-select">
                    <option value="" disabled th:selected="*{contactId} == null">Оберіть контакт</option>
                    <option th:each="c : ${contacts}"
                            th:value="${c.id}"
                            th:text="${c.firstName + ' ' + c.lastName}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Можливість</label>
                <select th:field="*{opportunityId}" class="form-select">
                    <option value="" disabled th:selected="*{opportunityId} == null">Оберіть можливість</option>
                    <option th:each="o : ${opportunities}"
                            th:value="${o.id}"
                            th:text="${o.name}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Зберегти</button>
            <a th:href="@{/activities}" class="btn btn-secondary">Скасувати</a>
        </form>
    </div>
</section>
</body>
</html>

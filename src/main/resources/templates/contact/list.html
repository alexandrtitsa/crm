<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Контакти</title>
</head>
<body>
<section class="activities-section">
    <h1>Контакти</h1>
    <a class="btn btn-primary mb-3" th:href="@{/contacts/new}">Додати</a>
    <table class="table table-striped table-bordered align-middle">
        <thead>
        <tr>
            <th>Ім’я</th>
            <th>Прізвище</th>
            <th>Email</th>
            <th>Телефон</th>
            <th>Посада</th>
            <th>Компанія</th>
            <th>Дії</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="contact : ${contacts}">
            <td th:text="${contact.firstName}"></td>
            <td th:text="${contact.lastName}"></td>
            <td th:text="${contact.email}"></td>
            <td th:text="${contact.phone}"></td>
            <td th:text="${contact.position}"></td>
            <td th:text="${contact.companyName}"></td>
            <td>
                <a th:href="@{'/contacts/' + ${contact.id} + '/edit'}" class="btn btn-sm btn-warning">Редагувати</a>
                <form th:action="@{'/contacts/' + ${contact.id} + '/delete'}" method="post" style="display:inline;">
                    <button class="btn btn-sm btn-danger">Видалити</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
